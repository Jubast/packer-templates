---
# ===========================================================================
# System configuration
# ===========================================================================
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-podman.conf
  become: true

- name: Allow unprivileged ports from 53 (covers DNS, HTTP, HTTPS)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '53'
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-podman.conf
  become: true

- name: Configure systemd-resolved to use AdGuard Home as upstream DNS
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNS='
    line: 'DNS=127.0.0.1:5353'
    backup: true
  become: true
  notify: Restart systemd-resolved

# ===========================================================================
# WireGuard
# ===========================================================================
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: false
  become: true

- name: Ensure /etc/wireguard directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

- name: Template wg0.conf
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  become: true
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0.service
    enabled: true
    state: started
    daemon_reload: true
  become: true

# ===========================================================================
# Firewall
# ===========================================================================
- name: Allow WireGuard
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    comment: "WireGuard"
  become: true

- name: Allow Nginx Proxy Manager HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "Nginx Proxy Manager - HTTP"
  become: true

- name: Allow Nginx Proxy Manager HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "Nginx Proxy Manager - HTTPS"
  become: true

- name: Allow Nginx Proxy Manager Admin UI
  community.general.ufw:
    rule: allow
    port: "81"
    proto: tcp
    comment: "Nginx Proxy Manager - Admin UI"
  become: true

- name: Allow AdGuard Home DNS (TCP)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: tcp
    comment: "AdGuard Home - DNS"
  become: true

- name: Allow AdGuard Home DNS (UDP)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: udp
    comment: "AdGuard Home - DNS"
  become: true

- name: Allow AdGuard Home UI
  community.general.ufw:
    rule: allow
    port: "8082"
    proto: tcp
    comment: "AdGuard Home - UI"
  become: true

- name: Reload ufw
  community.general.ufw:
    state: reloaded
  become: true

# ===========================================================================
# Nginx Proxy Manager
# ===========================================================================
- name: Create nginx-proxy-manager compose directory
  ansible.builtin.file:
    path: "{{ common_compose_base_dir }}/nginx-proxy-manager"
    state: directory
    mode: '0755'

- name: Copy nginx-proxy-manager docker-compose.yml
  ansible.builtin.copy:
    src: nginx-proxy-manager-docker-compose.yml
    dest: "{{ common_compose_base_dir }}/nginx-proxy-manager/docker-compose.yml"
    mode: '0644'
  notify: Restart nginx-proxy-manager container service

- name: Template nginx-proxy-manager .env
  ansible.builtin.template:
    src: nginx-proxy-manager.env.j2
    dest: "{{ common_compose_base_dir }}/nginx-proxy-manager/.env"
    mode: '0600'
  notify: Restart nginx-proxy-manager container service

- name: Deploy nginx-proxy-manager systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_service
  vars:
    common_service_name: nginx-proxy-manager

# ===========================================================================
# AdGuard Home
# ===========================================================================
- name: Create adguard-home compose directory
  ansible.builtin.file:
    path: "{{ common_compose_base_dir }}/adguard-home"
    state: directory
    mode: '0755'

- name: Template adguard-home docker-compose.yml
  ansible.builtin.template:
    src: adguard-home-docker-compose.yml.j2
    dest: "{{ common_compose_base_dir }}/adguard-home/docker-compose.yml"
    mode: '0644'
  notify: Restart adguard-home container service

- name: Deploy adguard-home systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_service
  vars:
    common_service_name: adguard-home

# ===========================================================================
# ddclient  (conf must be in place before container starts to avoid podman
#            bind-mounting it as a directory instead of a file)
# ===========================================================================
- name: Create ddclient compose directory
  ansible.builtin.file:
    path: "{{ common_compose_base_dir }}/ddclient"
    state: directory
    mode: '0755'

- name: Template ddclient.conf
  ansible.builtin.template:
    src: ddclient.conf.j2
    dest: "{{ common_compose_base_dir }}/ddclient/ddclient.conf"
    mode: '0600'

- name: Copy ddclient docker-compose.yml
  ansible.builtin.copy:
    src: ddclient-docker-compose.yml
    dest: "{{ common_compose_base_dir }}/ddclient/docker-compose.yml"
    mode: '0644'
  notify: Restart ddclient container service

- name: Deploy ddclient systemd service
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_service
  vars:
    common_service_name: ddclient

# ===========================================================================
# Healthcheck watcher
# ===========================================================================
- name: Setup container healthcheck watcher
  ansible.builtin.include_role:
    name: common
    tasks_from: setup_healthcheck
