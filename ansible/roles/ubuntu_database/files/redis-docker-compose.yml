version: '3'

volumes:
  redis:

services:
  redis:
    image: docker.io/redis:8.8.0-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    network_mode: pasta
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 100M
