---
# Deploy a single podman-compose service as a systemd user service.
#
# Required caller variables:
#   common_service_name  — name of the service (e.g. "nextcloud")
#
# Assumes the caller has already placed docker-compose.yml (and any env/conf
# files) in {{ common_compose_base_dir }}/{{ common_service_name }}/ before including this.

- name: "Create compose directory | {{ common_service_name }}"
  ansible.builtin.file:
    path: "{{ common_compose_base_dir }}/{{ common_service_name }}"
    state: directory
    mode: '0755'

- name: "Deploy systemd user service unit | {{ common_service_name }}"
  ansible.builtin.template:
    src: podman-compose.service.j2
    dest: "{{ common_user_systemd_dir }}/podman-compose-{{ common_service_name }}.service"
    mode: '0644'

- name: "Enable and start user service | {{ common_service_name }}"
  ansible.builtin.systemd:
    name: "podman-compose-{{ common_service_name }}.service"
    enabled: true
    state: started
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ container_user_uid }}"
