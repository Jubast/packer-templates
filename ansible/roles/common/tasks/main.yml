---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - qemu-guest-agent
      - podman
      - podman-compose
      - passt
      - sudo
    state: present
  become: true

- name: Switch from sudo-rs to legacy sudo
  community.general.alternatives:
    name: sudo
    path: /usr/bin/sudo.ws
  become: true

- name: Enable and start base services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  loop:
    - unattended-upgrades
    - qemu-guest-agent
    - fstrim.timer

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH"
  become: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
  become: true

- name: Disable Docker emulation warning
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: true

- name: Get container user UID
  ansible.builtin.command: id -u {{ container_user }}
  register: _uid_result
  changed_when: false

- name: Set container user UID fact
  ansible.builtin.set_fact:
    container_user_uid: "{{ _uid_result.stdout | trim }}"

- name: Check if user lingering is already enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ container_user }}"
  register: _linger_stat
  become: true

- name: Enable user lingering for {{ container_user }}
  ansible.builtin.command: loginctl enable-linger {{ container_user }}
  changed_when: true
  when: not _linger_stat.stat.exists
  become: true

- name: Create user systemd directory
  ansible.builtin.file:
    path: "{{ common_user_systemd_dir }}"
    state: directory
    mode: '0755'

- name: Create user local bin directory
  ansible.builtin.file:
    path: "{{ common_user_bin_dir }}"
    state: directory
    mode: '0755'

- name: Create containers base directory
  ansible.builtin.file:
    path: "{{ common_compose_base_dir }}"
    state: directory
    mode: '0755'

- name: Create user containers config directory
  ansible.builtin.file:
    path: "/home/{{ container_user }}/.config/containers"
    state: directory
    mode: '0755'

- name: Configure podman to use pasta network driver
  ansible.builtin.template:
    src: containers.conf.j2
    dest: "/home/{{ container_user }}/.config/containers/containers.conf"
    mode: '0644'

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'
  become: true

- name: Cap podman container log retention to 1 week via journald
  ansible.builtin.template:
    src: journald-podman-retention.conf.j2
    dest: /etc/systemd/journald.conf.d/podman-retention.conf
    mode: '0644'
  become: true
  register: _journald_retention_conf

- name: Restart systemd-journald to apply log retention settings
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true
  when: _journald_retention_conf.changed
