---
# Deploy the container healthcheck watcher script and its systemd timer.
# Restarts any podman containers that enter an unhealthy state every 2 minutes.

- name: Deploy container healthcheck script
  ansible.builtin.copy:
    src: container-healthcheck.sh
    dest: "{{ common_user_bin_dir }}/container-healthcheck.sh"
    mode: '0755'

- name: Deploy container healthcheck service unit
  ansible.builtin.template:
    src: container-healthcheck.service.j2
    dest: "{{ common_user_systemd_dir }}/container-healthcheck.service"
    mode: '0644'

- name: Deploy container healthcheck timer unit
  ansible.builtin.copy:
    src: container-healthcheck.timer
    dest: "{{ common_user_systemd_dir }}/container-healthcheck.timer"
    mode: '0644'

- name: Enable container healthcheck timer
  ansible.builtin.systemd:
    name: container-healthcheck.timer
    enabled: "{{ start_services }}"
    state: "{{ 'started' if start_services else omit }}"
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ container_user_uid }}"
