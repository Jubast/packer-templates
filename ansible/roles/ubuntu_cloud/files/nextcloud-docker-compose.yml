version: '3'

# MariaDB and Redis are provided by ubuntu-database server.
# Ensure the nextcloud database and user are pre-created on that host:
#   CREATE DATABASE <nextcloud_db_name>;
#   CREATE USER '<nextcloud_db_user>'@'%' IDENTIFIED BY '<password>';
#   GRANT ALL PRIVILEGES ON <nextcloud_db_name>.* TO '<nextcloud_db_user>'@'%';
# The Redis password must match the one set in ubuntu-database (database_redis_password).

volumes:
  nextcloud-data:
  onlyoffice-data:
  onlyoffice-fonts:
  onlyoffice-logs:
  onlyoffice-lib-onlyoffice:
  onlyoffice-lib-postgresql:
  onlyoffice-lib-rabbitmq:
  onlyoffice-lib-redis:

services:
  nextcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/nextcloud-ffmpeg:33-apache
    restart: unless-stopped
    network_mode: pasta
    ports:
      - 8080:80    # web UI
    volumes:
      - nextcloud-data:/var/www/html
      - ./hooks:/docker-entrypoint-hooks.d:ro
    env_file:
      - nextcloud.env
    depends_on:
      - imaginary
      - onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 2m
      start_interval: 15s
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 3072M

  imaginary:
    image: docker.io/nextcloud/aio-imaginary:20260527_140826
    restart: unless-stopped
    network_mode: pasta
    ports:
      - 9000:9000
    command: -concurrency 50 -enable-url-source
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 512M

  onlyoffice:
    image: docker.io/onlyoffice/documentserver:9.4.0
    restart: unless-stopped
    network_mode: pasta
    ports:
      - 8082:80    # OnlyOffice Document Server
    volumes:
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-fonts:/usr/share/fonts/truetype/custom
      - onlyoffice-lib-onlyoffice:/var/lib/onlyoffice
      - onlyoffice-lib-postgresql:/var/lib/postgresql
      - onlyoffice-lib-rabbitmq:/var/lib/rabbitmq
      - onlyoffice-lib-redis:/var/lib/redis
    env_file:
      - onlyoffice.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      start_period: 2m
      start_interval: 15s
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2048M
