version: '3'

volumes:
  qbittorrent-config:

services:
  qbittorrent:
    image: docker.io/linuxserver/qbittorrent:5.1.4
    restart: unless-stopped
    ports:
      - 8080:8080          # web UI
      - 6881:6881          # BitTorrent TCP
      - 6881:6881/udp      # BitTorrent UDP
    volumes:
      - qbittorrent-config:/config
      - /srv/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
